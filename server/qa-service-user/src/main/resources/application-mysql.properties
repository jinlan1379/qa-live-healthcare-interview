# MySQL profile - use with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/qa_healthcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
spring.datasource.username=qa_user
spring.datasource.password=qa_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
spring.sql.init.mode=never
